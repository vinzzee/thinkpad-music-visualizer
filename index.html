<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThinkPad Audio Visualizer</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-red: #e60012;
            --glass-bg: rgba(18, 18, 18, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Bottom Left Settings Toggle Button */
        .settings-toggle {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 20;
            width: 44px;
            height: 44px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-bottom: 2px solid var(--accent-red);
            border-radius: 4px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            transition: all 0.2s ease;
        }

        .settings-toggle:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            border-bottom-color: var(--accent-red);
        }

        .settings-toggle svg {
            width: 20px;
            height: 20px;
            fill: var(--text-color);
            transition: transform 0.3s ease;
        }

        .settings-toggle:hover svg {
            transform: rotate(45deg);
        }

        /* Glassmorphism UI Panel */
        .ui-panel {
            position: absolute;
            bottom: 74px;
            left: 20px;
            z-index: 10;
            width: 320px;
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-top: 3px solid var(--accent-red);
            border-radius: 4px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            
            /* Hidden State Transitions */
            opacity: 0;
            pointer-events: none;
            transform: translateY(15px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .ui-panel.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--glass-border);
        }

        .panel-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .thinkpad-badge {
            width: 10px;
            height: 10px;
            background-color: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-red);
        }

        .control-group {
            margin-bottom: 16px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #cccccc;
        }

        .control-group label span.val {
            color: var(--accent-red);
            font-weight: bold;
        }

        /* Range Slider Styling */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-red);
            cursor: pointer;
            box-shadow: 0 0 6px rgba(230, 0, 18, 0.8);
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Buttons & Controls */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .btn {
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn.active {
            border-color: var(--accent-red);
            background: rgba(230, 0, 18, 0.2);
        }

        .btn-full {
            grid-column: span 2;
        }

        #file-input {
            display: none;
        }

        .status-bar {
            margin-top: 14px;
            font-size: 10px;
            letter-spacing: 0.5px;
            color: #888888;
            text-transform: uppercase;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <!-- Bottom Left Toggle Button -->
    <button class="settings-toggle" id="toggle-menu" title="Toggle Settings">
        <svg viewBox="0 0 24 24">
            <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
    </button>

    <!-- Glassmorphism Panel -->
    <div class="ui-panel" id="ui-panel">
        <div class="panel-header">
            <span class="panel-title">Visualizer // CTRL</span>
            <div class="thinkpad-badge"></div>
        </div>

        <div class="control-group">
            <label>Response Time (Smoothing) <span id="smoothing-val" class="val">0.85</span></label>
            <input type="range" id="smoothing" min="0.10" max="0.95" step="0.01" value="0.85">
        </div>

        <div class="control-group">
            <label>Reaction Intensity <span id="intensity-val" class="val">1.5x</span></label>
            <input type="range" id="intensity" min="0.5" max="4.0" step="0.1" value="1.5">
        </div>

        <div class="button-group">
            <button id="btn-system" class="btn btn-full">System Audio (Loopback)</button>
            <button id="btn-mic" class="btn">Microphone</button>
            <button id="btn-file" class="btn">Upload File</button>
        </div>
        <input type="file" id="file-input" accept="audio/*">

        <div class="status-bar" id="status-text">Status: Select Source</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // UI Toggle
        const toggleBtn = document.getElementById('toggle-menu');
        const uiPanel = document.getElementById('ui-panel');

        // Controls
        const smoothingSlider = document.getElementById('smoothing');
        const intensitySlider = document.getElementById('intensity');
        const smoothingVal = document.getElementById('smoothing-val');
        const intensityVal = document.getElementById('intensity-val');
        const btnSystem = document.getElementById('btn-system');
        const btnMic = document.getElementById('btn-mic');
        const btnFile = document.getElementById('btn-file');
        const fileInput = document.getElementById('file-input');
        const statusText = document.getElementById('status-text');

        let audioCtx, analyser, source;
        let activeStream = null;
        let audioData = new Uint8Array(0);
        let isAudioActive = false;
        let audioElement = null;

        // Settings
        let smoothing = parseFloat(smoothingSlider.value);
        let intensity = parseFloat(intensitySlider.value);

        // Toggle UI Menu
        toggleBtn.addEventListener('click', () => {
            uiPanel.classList.toggle('open');
        });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Control listeners
        smoothingSlider.addEventListener('input', (e) => {
            smoothing = parseFloat(e.target.value);
            smoothingVal.textContent = smoothing.toFixed(2);
            if (analyser) analyser.smoothingTimeConstant = smoothing;
        });

        intensitySlider.addEventListener('input', (e) => {
            intensity = parseFloat(e.target.value);
            intensityVal.textContent = intensity.toFixed(1) + 'x';
        });

        function clearActiveSources() {
            if (source) source.disconnect();
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
                activeStream = null;
            }
            if (audioElement) { 
                audioElement.pause(); 
                audioElement = null; 
            }
            btnMic.classList.remove('active');
            btnFile.classList.remove('active');
            btnSystem.classList.remove('active');
        }

        // Initialize Audio Context
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = smoothing;
                audioData = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 1. Capture System/Device Audio Stream (Screen Capture Loopback)
        btnSystem.addEventListener('click', async () => {
            initAudio();
            clearActiveSources();

            try {
                // Request display media with audio enabled
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });

                const audioTracks = stream.getAudioTracks();
                if (audioTracks.length === 0) {
                    statusText.textContent = 'Error: No audio shared. Check "Share Audio" box.';
                    stream.getTracks().forEach(track => track.stop());
                    return;
                }

                activeStream = stream;
                source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);

                // Hide video track to save resource overhead
                stream.getVideoTracks().forEach(track => track.stop());

                btnSystem.classList.add('active');
                statusText.textContent = 'Source: System Audio Capture';
                isAudioActive = true;
            } catch (err) {
                statusText.textContent = 'System Audio Cancelled or Unsupported';
            }
        });

        // 2. Microphone Input
        btnMic.addEventListener('click', async () => {
            initAudio();
            clearActiveSources();

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                activeStream = stream;
                source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);

                btnMic.classList.add('active');
                statusText.textContent = 'Source: Microphone Input';
                isAudioActive = true;
            } catch (err) {
                statusText.textContent = 'Mic Error: Access Denied';
            }
        });

        // 3. Local File Input
        btnFile.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            initAudio();
            clearActiveSources();

            audioElement = new Audio(URL.createObjectURL(file));
            audioElement.loop = true;
            audioElement.play();

            source = audioCtx.createMediaElementSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            btnFile.classList.add('active');
            statusText.textContent = `File: ${file.name.substring(0, 18)}...`;
            isAudioActive = true;
        });

        // Floating Artifact Class
        class Artifact {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.baseSize = Math.random() * 12 + 4;
                this.shape = Math.floor(Math.random() * 4); // 0: square, 1: cross, 2: ring, 3: red trackpoint node
                this.freqIndex = Math.floor(Math.random() * 64);
                this.rotation = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.02;
            }

            update(audioVal) {
                const boost = (audioVal / 255) * intensity;

                this.x += this.vx * (1 + boost * 2);
                this.y += this.vy * (1 + boost * 2);
                this.rotation += this.vRot * (1 + boost);

                // Screen Wrap
                if (this.x < -20) this.x = canvas.width + 20;
                if (this.x > canvas.width + 20) this.x = -20;
                if (this.y < -20) this.y = canvas.height + 20;
                if (this.y > canvas.height + 20) this.y = -20;
            }

            draw(ctx, audioVal) {
                const react = (audioVal / 255) * intensity;
                const size = this.baseSize + react * 24;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                ctx.lineWidth = 1 + react * 1.5;

                switch (this.shape) {
                    case 0: // Wireframe Square
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.2 + react * 0.8})`;
                        ctx.strokeRect(-size / 2, -size / 2, size, size);
                        break;

                    case 1: // Technical Crosshair
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 + react * 0.7})`;
                        ctx.beginPath();
                        ctx.moveTo(-size, 0); ctx.lineTo(size, 0);
                        ctx.moveTo(0, -size); ctx.lineTo(0, size);
                        ctx.stroke();
                        break;

                    case 2: // Concentric Ring
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.2 + react * 0.8})`;
                        ctx.beginPath();
                        ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
                        ctx.stroke();
                        break;

                    case 3: // ThinkPad TrackPoint Red Accent Node
                        ctx.fillStyle = `#e60012`;
                        ctx.shadowColor = '#e60012';
                        ctx.shadowBlur = 4 + react * 12;
                        ctx.beginPath();
                        ctx.arc(0, 0, Math.max(2, size / 3), 0, Math.PI * 2);
                        ctx.fill();
                        break;
                }

                ctx.restore();
            }
        }

        const artifacts = Array.from({ length: 65 }, () => new Artifact());

        // Background Audio Spectrum Grid
        function drawCenterSpectrum(data) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const bars = 64;
            const radius = Math.min(cx, cy) * 0.25;

            ctx.save();
            ctx.translate(cx, cy);

            for (let i = 0; i < bars; i++) {
                const angle = (i / bars) * Math.PI * 2;
                const rawVal = data[i] || 0;
                const barHeight = (rawVal / 255) * 120 * intensity;

                const x1 = Math.cos(angle) * radius;
                const y1 = Math.sin(angle) * radius;
                const x2 = Math.cos(angle) * (radius + barHeight);
                const y2 = Math.sin(angle) * (radius + barHeight);

                ctx.strokeStyle = (i % 8 === 0) ? '#e60012' : `rgba(255, 255, 255, ${0.15 + (rawVal / 255) * 0.6})`;
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }

            ctx.restore();
        }

        // Render Loop
        function render() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (isAudioActive && analyser) {
                analyser.getByteFrequencyData(audioData);
            }

            drawCenterSpectrum(audioData);

            artifacts.forEach((artifact) => {
                const val = audioData[artifact.freqIndex] || 0;
                artifact.update(val);
                artifact.draw(ctx, val);
            });

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
